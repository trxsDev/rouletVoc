name: Build Windows .exe Installer

# Quota-Optimized Triggers:
# 1. Manual button in GitHub Actions tab (Run workflow)
# 2. Release Tag push (e.g. git push origin v1.0.0)
# 3. Regular commit on 'main' ONLY IF commit message contains '[build]' or '[release]'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (leave empty to use version.py)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-windows:
    # Skip standard commits unless explicitly tagged with [build] or [release] or triggered manually
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Version from version.py
        id: version
        shell: bash
        run: |
          # Priority: workflow_dispatch input > version.py > git tag
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VER" ]; then
            VER="$INPUT_VER"
          elif [ -f version.py ]; then
            VER=$(python -c "exec(open('version.py').read()); print(__version__)")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="0.0.0-dev"
          fi
          echo "APP_VERSION=$VER" >> $GITHUB_ENV
          echo "📦 Building version: $VER"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download MediaPipe Hand Landmarker Model (if missing)
        run: |
          python -c "
          import os, urllib.request
          url = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
          if not os.path.exists('hand_landmarker.task'):
              print('Downloading hand_landmarker.task...')
              urllib.request.urlretrieve(url, 'hand_landmarker.task')
          "

      - name: Build Standalone .exe with PyInstaller
        run: |
          pyinstaller --clean build_scripts/build_win.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Single-File Setup Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVer=${{ env.APP_VERSION }} build_scripts/installer_config.iss

      - name: Upload Installer (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouletVoc-Windows-Setup-EXE
          path: dist/*_Setup_*.exe
          retention-days: 14

      # ── Auto-Upload to Google Drive ──────────────────────────
      # Requires GitHub Secrets: GOOGLE_DRIVE_CLIENT_ID, GOOGLE_DRIVE_CLIENT_SECRET, GOOGLE_DRIVE_REFRESH_TOKEN, GOOGLE_DRIVE_FOLDER_ID
      # See build_scripts/upload_to_drive.py for details
      - name: Install Google Drive Upload Dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Upload Installer to Google Drive
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        if: ${{ env.GOOGLE_DRIVE_REFRESH_TOKEN != '' }}
        run: python build_scripts/upload_to_drive.py
